<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>识办</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f5f7;
        color: #1c1c1e;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      }
      main {
        width: min(420px, calc(100% - 32px));
        background: #fff;
        border-radius: 28px;
        padding: 36px 28px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.06);
      }
      h1 { margin: 0; font-size: 40px; letter-spacing: -0.04em; }
      p { margin: 10px 0 0; color: #8e8e93; line-height: 1.5; }
      .version { margin-top: 22px; font-size: 13px; }
      .downloads { display: grid; gap: 10px; margin-top: 22px; }
      a {
        display: block;
        text-align: center;
        text-decoration: none;
        border-radius: 16px;
        padding: 14px 16px;
        font-size: 16px;
      }
      .primary { background: #007aff; color: #fff; }
      .secondary { background: #f2f2f7; color: #1c1c1e; }
    </style>
  </head>
  <body>
    <main>
      <h1>识办</h1>
      <p>把图片或文字收成待办。</p>
      <p class="version" id="version">正在读取版本…</p>
      <div class="downloads">
        <a class="primary" href="/download/shiban.apk">下载 Android</a>
        <a class="secondary" href="/download/shiban-mac.dmg">下载 Mac（M 系列）</a>
        <a class="secondary" href="/download/shiban-windows.exe">下载 Windows</a>
      </div>
    </main>
    <script>
      fetch("/api/app")
        .then((response) => response.json())
        .then((data) => {
          if (data.version) document.querySelector("#version").textContent = "当前版本 " + data.version;
        })
        .catch(() => {
          document.querySelector("#version").textContent = "";
        });
    </script>
  </body>
</html>
