name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$sdk"
          export PATH="$sdk/cmdline-tools/latest/bin:$sdk/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: restore debug signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          fi
      - name: build apk
        working-directory: app
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/debug/shiban-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: build Windows installer
        working-directory: desktop
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: build Mac installer
        working-directory: desktop
        run: npm run tauri build -- --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

  publish:
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" = "main" ] || [ -z "$tag" ]; then tag="v1.5.0"; fi
          mkdir -p out
          cp dist/android-apk/*.apk "out/shiban-${tag}.apk"
          cp dist/windows-installer/*.exe "out/shiban-${tag}-windows-x64.exe"
          cp dist/macos-dmg/*.dmg "out/shiban-${tag}-macos-arm64.dmg"
          notes=$(cat <<EOF
          识办 ${tag}

          - Android：\`shiban-${tag}.apk\`
          - Mac M 系列：\`shiban-${tag}-macos-arm64.dmg\`
          - Windows：\`shiban-${tag}-windows-x64.exe\`

          手机可在设置里检查更新，安装包从 GitHub Releases 下载。桌面端在菜单里点「检查更新」查看下载地址。
          服务是否正常请用应用内「探活」，探活连的是识办服务，不走 GitHub。
          EOF
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --title "识办 ${tag}" --notes "$notes"
          fi
